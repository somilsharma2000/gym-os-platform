<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYM OS — Multi-Tenant Gym Management Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#0A0A0C;--card:#16161A;--accent:#DC2626;--text:#FAFAFA;--muted:#8E8E93;--border:rgba(255,255,255,0.08);--green:#22C55E;--yellow:#F59E0B;--red:#EF4444;--blue:#6366F1}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;margin:0;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.btn{padding:8px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-secondary{background:rgba(255,255,255,0.08);color:var(--text)}.btn-secondary:hover{background:rgba(255,255,255,0.12)}
.btn-sm{padding:6px 12px;font-size:12px}
input,select,textarea{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.badge{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}.badge-blue{background:rgba(99,102,241,.15);color:var(--blue)}
.badge-gray{background:rgba(255,255,255,.06);color:var(--muted)}
.nav-item{padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:10px}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(220,38,38,.12);color:var(--accent)}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px 14px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
tr:hover{background:rgba(255,255,255,.02);cursor:pointer}
.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:12px;font-weight:600;z-index:9999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.loading{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stat-card{padding:20px}.stat-num{font-size:32px;font-weight:700;margin-top:8px}.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='https://solene-dcb41753.base44.app/functions/gymOsApi';
let state={role:null,gymId:null,gymName:null,memberToken:null,view:'dashboard',selectedLead:null,selectedProject:null,selectedMember:null,gymColors:{primary:'#DC2626',secondary:'#0A0A0C',accent:'#F59E0B'}};

async function api(action,data={},id=null){
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data,id})});
    return await res.json();
  }catch(e){return{success:false,message:e.message}}
}

function toast(msg,type='success'){
  const colors={success:'var(--green)',error:'var(--red)',info:'var(--blue)'};
  const t=document.createElement('div');t.className='toast';t.style.background=colors[type];t.style.color='#fff';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function badge(text,color){
  const map={'NEW':'badge-gray','RESEARCHING':'badge-blue','RESEARCHED':'badge-blue','QUALIFIED':'badge-green','NOT QUALIFIED':'badge-red','PROJECT CREATED':'badge-blue','BUILDING':'badge-yellow','QA':'badge-yellow','READY':'badge-green','READY TO CONTACT':'badge-green','CONTACTED':'badge-blue','REPLIED':'badge-blue','INTERESTED':'badge-green','WON':'badge-green','LOST':'badge-red','ACTIVE':'badge-green','EXPIRING SOON':'badge-yellow','EXPIRED':'badge-red','INACTIVE':'badge-gray','FROZEN':'badge-blue','PASS':'badge-green','FAIL':'badge-red','NOT TESTED':'badge-gray','NOT APPLICABLE':'badge-gray','PLANNED':'badge-gray','TESTING':'badge-yellow','BLOCKED':'badge-red','ARCHIVED':'badge-gray'};
  return `<span class="badge ${map[text]||'badge-gray'}">${text}</span>`;
}

function el(id){return document.getElementById(id)}
function val(id){const e=el(id);return e?e.value:''}

// Load state from localStorage
function loadState(){const s=localStorage.getItem('gymOsState');if(s){state={...state,...JSON.parse(s)}}}
function saveState(){const{role,gymId,gymName,memberToken}=state;localStorage.setItem('gymOsState',JSON.stringify({role,gymId,gymName,memberToken}))}
loadState();

// === RENDER ===
function render(){
  const app=el('app');
  if(!state.role){renderLogin();return}
  if(state.role==='member'){renderMemberPortal();return}
  if(state.role==='agency'){renderAgencyOS();return}
  if(state.role==='gym'){if(!state.gymId){renderTenantSelector();return}renderGymOS();return}
  app.innerHTML='<div class="p-8">Unknown role</div>';
}

// === LOGIN ===
function renderLogin(){
  el('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="card p-10 max-w-md w-full text-center">
      <div class="text-4xl font-black mb-2" style="color:var(--accent)">GYM OS</div>
      <div class="text-sm mb-8" style="color:var(--muted)">Multi-Tenant Gym Management Platform</div>
      <div class="space-y-3">
        <button class="btn btn-primary w-full py-4 text-lg" onclick="state.role='agency';saveState();render()">Agency Super Admin</button>
        <div class="text-xs" style="color:var(--muted)">Full access to leads, research, projects, QA, client conversion</div>
        <button class="btn btn-secondary w-full py-4 text-lg" onclick="state.role='gym';saveState();render()">Gym Owner</button>
        <div class="text-xs" style="color:var(--muted)">Manage members, memberships, QR attendance, leads</div>
        <button class="btn btn-secondary w-full py-4 text-lg" onclick="state.role='member';saveState();render()">Member Portal</button>
        <div class="text-xs" style="color:var(--muted)">View QR pass, membership, attendance history</div>
      </div>
    </div>
  </div>`;
}

// === TENANT SELECTOR ===
async function renderTenantSelector(){
  el('app').innerHTML=`<div class="p-8"><div class="loading"></div> Loading gyms...</div>`;
  const res=await api('listTenants');
  if(!res.success){el('app').innerHTML='<div class="p-8 text-red-500">Error loading gyms</div>';return}
  el('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="card p-8 max-w-2xl w-full">
      <div class="text-2xl font-bold mb-6">Select Your Gym</div>
      <div class="space-y-3">
        ${res.data.map(t=>`
          <div class="card p-4 cursor-pointer hover:border-red-500" onclick="selectTenant('${t.id}','${t.gym_name}')">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold" style="background:${t.primary_color||'#DC2626'};color:#fff">${t.gym_name[0]}</div>
              <div><div class="font-bold text-lg">${t.gym_name}</div><div class="text-sm" style="color:var(--muted)">${t.address||'No address'}</div></div>
              ${badge(t.status||'ACTIVE')}
            </div>
          </div>`).join('')}
      </div>
      <button class="btn btn-secondary mt-6" onclick="state.role=null;saveState();render()">← Back</button>
    </div>
  </div>`;
}

async function selectTenant(id,name){
  const res=await api('getTenant',null,id);
  if(res.success){state.gymColors={primary:res.data.primary_color||'#DC2626',secondary:res.data.secondary_color||'#0A0A0C',accent:res.data.accent_color||'#F59E0B'}}
  state.gymId=id;state.gymName=name;saveState();render();
}

// === AGENCY OS ===
function renderAgencyOS(){
  const nav=[['dashboard','Dashboard'],['leads','Leads'],['projects','Projects'],['qa','QA'],['clients','Clients']];
  const icons={dashboard:'📊',leads:'🎯',projects:'🏗️',qa:'✅',clients:'🏢'};
  el('app').innerHTML=`
  <div class="flex min-h-screen">
    <div class="w-60 border-r p-4 flex flex-col" style="border-color:var(--border)">
      <div class="text-2xl font-black mb-8 px-2" style="color:var(--accent)">GYM OS</div>
      <div class="text-xs uppercase tracking-wider mb-2 px-2" style="color:var(--muted)">Agency OS</div>
      ${nav.map(([v,l])=>`<div class="nav-item ${state.view===v?'active':''}" onclick="navTo('${v}')">${icons[v]||'■'} ${l}</div>`).join('')}
      <div class="mt-auto pt-4 border-t" style="border-color:var(--border)">
        <button class="btn btn-secondary w-full" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="flex-1 p-6 overflow-auto" id="content"><div class="loading"></div></div>
  </div>`;
  loadAgencyView();
}

function navTo(v){state.view=v;document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));render();}

async function loadAgencyView(){
  const c=el('content');if(!c)return;
  switch(state.view){
    case'dashboard':return agencyDashboard();
    case'leads':return agencyLeads();
    case'projects':return agencyProjects();
    case'qa':return agencyQA();
    case'clients':return agencyClients();
  }
}

async function agencyDashboard(){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const[leads,projects,tenants]=await Promise.all([api('listLeads'),api('listProjects'),api('listTenants')]);
  const ld=leads.data||[],pr=projects.data||[],tn=tenants.data||[];
  const qualified=ld.filter(l=>l.status==='QUALIFIED').length;
  el('content').innerHTML=`
    <div class="text-2xl font-bold mb-6">Agency Dashboard</div>
    <div class="grid grid-cols-4 gap-4 mb-8">
      <div class="card stat-card"><div class="stat-label">Total Leads</div><div class="stat-num" style="color:var(--blue)">${ld.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Qualified</div><div class="stat-num" style="color:var(--green)">${qualified}</div></div>
      <div class="card stat-card"><div class="stat-label">Active Projects</div><div class="stat-num" style="color:var(--yellow)">${pr.length}</div></div>
      <div class="card stat-card"><div class="stat-label">Clients</div><div class="stat-num" style="color:var(--accent)">${tn.length}</div></div>
    </div>
    <div class="card p-6 mb-6">
      <div class="text-lg font-bold mb-4">Pipeline Overview</div>
      <div class="space-y-2">
        ${['NEW','RESEARCHED','QUALIFIED','PROJECT CREATED','WON'].map(s=>{const c=ld.filter(l=>l.status===s).length;return`<div class="flex items-center gap-3"><div class="w-32 text-sm" style="color:var(--muted)">${s}</div><div class="flex-1 h-6 rounded-full overflow-hidden" style="background:rgba(255,255,255,.04)"><div class="h-full rounded-full" style="width:${ld.length?c/ld.length*100:0}%;background:var(--accent)"></div></div><div class="w-8 text-right font-bold">${c}</div></div>`}).join('')}
      </div>
    </div>
    <div class="card p-6">
      <div class="text-lg font-bold mb-4">Recent Leads</div>
      <table><thead><tr><th>Business</th><th>City</th><th>Status</th><th>Verified</th></tr></thead>
      <tbody>${ld.slice(0,10).map(l=>`<tr onclick="viewLead('${l.id}')"><td class="font-semibold">${l.business_name||'-'}</td><td>${l.city||'-'}</td><td>${badge(l.status)}</td><td>${badge(l.verification_status||'UNVERIFIED')}</td></tr>`).join('')}</tbody></table>
      ${ld.length===0?'<div class="text-center py-8" style="color:var(--muted)">No leads yet. Create one from the Leads tab.</div>':''}
    </div>`;
}

async function agencyLeads(){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const res=await api('listLeads');
  const ld=res.data||[];
  el('content').innerHTML=`
    <div class="flex justify-between items-center mb-6">
      <div class="text-2xl font-bold">Leads</div>
      <button class="btn btn-primary" onclick="showLeadForm()">+ New Lead</button>
    </div>
    <div class="card p-4 mb-4">
      <input id="leadSearch" placeholder="Search by name or city..." oninput="filterLeads(this.value)" class="!w-auto">
    </div>
    <div class="card overflow-hidden">
      <table><thead><tr><th>Business</th><th>Category</th><th>City</th><th>Status</th><th>Verification</th><th>Decision Maker</th></tr></thead>
      <tbody id="leadTableBody">${ld.map(l=>leadRow(l)).join('')}</tbody></table>
      ${ld.length===0?'<div class="text-center py-8" style="color:var(--muted)">No leads yet. Click "New Lead" to create one.</div>':''}
    </div>`;
  window._allLeads=ld;
}

function leadRow(l){return`<tr onclick="viewLead('${l.id}')"><td class="font-semibold">${l.business_name||'-'}</td><td>${l.category||'-'}</td><td>${l.city||'-'}</td><td>${badge(l.status)}</td><td>${badge(l.verification_status||'UNVERIFIED')}</td><td>${l.decision_maker_name||'-'} ${l.decision_maker_role?'<span style="color:var(--muted)">('+l.decision_maker_role+')</span>':''}</td></tr>`}

function filterLeads(q){
  const f=window._allLeads.filter(l=>!q||l.business_name?.toLowerCase().includes(q.toLowerCase())||l.city?.toLowerCase().includes(q.toLowerCase()));
  el('leadTableBody').innerHTML=f.map(leadRow).join('');
}

function showLeadForm(){
  el('app').insertAdjacentHTML('beforeend',`
  <div class="modal-bg" id="leadModal" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <div class="text-xl font-bold mb-4">New Lead</div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs" style="color:var(--muted)">Business Name *</label><input id="lf_name" placeholder="Gym name"></div>
        <div><label class="text-xs" style="color:var(--muted)">Category</label><input id="lf_cat" placeholder="Boxing/MMA"></div>
        <div><label class="text-xs" style="color:var(--muted)">Address</label><input id="lf_addr"></div>
        <div><label class="text-xs" style="color:var(--muted)">City</label><input id="lf_city" value="Manchester"></div>
        <div><label class="text-xs" style="color:var(--muted)">Phone</label><input id="lf_phone"></div>
        <div><label class="text-xs" style="color:var(--muted)">WhatsApp</label><input id="lf_wa"></div>
        <div><label class="text-xs" style="color:var(--muted)">Email</label><input id="lf_email"></div>
        <div><label class="text-xs" style="color:var(--muted)">Website</label><input id="lf_web"></div>
        <div><label class="text-xs" style="color:var(--muted)">Instagram</label><input id="lf_ig"></div>
        <div><label class="text-xs" style="color:var(--muted)">Facebook</label><input id="lf_fb"></div>
        <div><label class="text-xs" style="color:var(--muted)">Decision Maker</label><input id="lf_dm"></div>
        <div><label class="text-xs" style="color:var(--muted)">DM Role</label><input id="lf_dmr"></div>
      </div>
      <div class="mt-3"><label class="text-xs" style="color:var(--muted)">Notes</label><textarea id="lf_notes" rows="2"></textarea></div>
      <div class="flex gap-3 mt-4">
        <button class="btn btn-secondary flex-1" onclick="el('leadModal').remove()">Cancel</button>
        <button class="btn btn-primary flex-1" onclick="submitLead()">Create Lead</button>
      </div>
    </div>
  </div>`);
}

async function submitLead(){
  const data={business_name:val('lf_name'),category:val('lf_cat'),address:val('lf_addr'),city:val('lf_city'),phone_primary:val('lf_phone'),whatsapp:val('lf_wa'),email:val('lf_email'),website:val('lf_web'),instagram:val('lf_ig'),facebook:val('lf_fb'),decision_maker_name:val('lf_dm'),decision_maker_role:val('lf_dmr'),notes:val('lf_notes'),verification_status:'UNVERIFIED',status:'NEW'};
  if(!data.business_name){toast('Business name required','error');return}
  el('leadModal').remove();toast('Creating lead...');
  const res=await api('createLead',data);
  if(res.success){toast('Lead created!');agencyLeads()}else{toast(res.message||'Error','error')}
}

async function viewLead(id){
  el('content').innerHTML='<div class="loading"></div> Loading lead...';
  const[leadRes,researchRes,dnaRes,projectsRes]=await Promise.all([api('listLeads'),api('getResearch',null,id),api('getBrandDNA',null,id),api('listProjects')]);
  const lead=leadRes.data?.find(l=>l.id===id);if(!lead){toast('Lead not found','error');return}
  const research=researchRes.data||[];const dna=dnaRes.data;const projects=projectsRes.data?.filter(p=>p.lead_id===id)||[];
  el('content').innerHTML=`
    <div class="flex items-center gap-4 mb-6">
      <button class="btn btn-secondary btn-sm" onclick="navTo('leads')">← Back</button>
      <div class="text-2xl font-bold">${lead.business_name}</div>
      ${badge(lead.status)}
    </div>
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="card p-5">
        <div class="text-sm font-bold mb-3">Contact Info</div>
        <div class="space-y-2 text-sm">
          <div><span style="color:var(--muted)">Phone:</span> ${lead.phone_primary||'-'}</div>
          <div><span style="color:var(--muted)">WhatsApp:</span> ${lead.whatsapp||'-'}</div>
          <div><span style="color:var(--muted)">Email:</span> ${lead.email||'-'}</div>
          <div><span style="color:var(--muted)">Website:</span> ${lead.website?`<a href="${lead.website}" target="_blank" style="color:var(--blue)">${lead.website}</a>`:'-'}</div>
          <div><span style="color:var(--muted)">IG:</span> ${lead.instagram||'-'}</div>
          <div><span style="color:var(--muted)">FB:</span> ${lead.facebook||'-'}</div>
        </div>
      </div>
      <div class="card p-5">
        <div class="text-sm font-bold mb-3">Business Info</div>
        <div class="space-y-2 text-sm">
          <div><span style="color:var(--muted)">Category:</span> ${lead.category||'-'}</div>
          <div><span style="color:var(--muted)">Address:</span> ${lead.address||'-'}</div>
          <div><span style="color:var(--muted)">City:</span> ${lead.city||'-'}</div>
          <div><span style="color:var(--muted)">Decision Maker:</span> ${lead.decision_maker_name||'-'} ${lead.decision_maker_role?'('+lead.decision_maker_role+')':''}</div>
          <div><span style="color:var(--muted)">Source:</span> ${lead.contact_source||'-'}</div>
          <div><span style="color:var(--muted)">Verification:</span> ${badge(lead.verification_status||'UNVERIFIED')}</div>
        </div>
      </div>
      <div class="card p-5">
        <div class="text-sm font-bold mb-3">Status Update</div>
        <select onchange="updateLeadStatus('${id}',this.value)" class="mb-3">
          ${['NEW','RESEARCHING','RESEARCHED','QUALIFIED','NOT QUALIFIED','PROJECT CREATED','BUILDING','QA','READY TO CONTACT','CONTACTED','REPLIED','INTERESTED','DEMO BOOKED','PROPOSAL','NEGOTIATION','WON','LOST','DO NOT CONTACT'].map(s=>`<option ${lead.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <div class="text-xs" style="color:var(--muted)">Notes: ${lead.notes||'None'}</div>
      </div>
    </div>
    <!-- Research Section -->
    <div class="card p-6 mb-6">
      <div class="flex justify-between items-center mb-4"><div class="text-lg font-bold">Research Records</div><button class="btn btn-primary btn-sm" onclick="showResearchForm('${id}')">+ Add Research</button></div>
      ${research.length===0?'<div class="text-center py-4" style="color:var(--muted)">No research yet</div>':research.map(r=>`
        <div class="card p-4 mb-3" style="background:rgba(255,255,255,.02)">
          <div class="flex justify-between items-start mb-2">
            <div class="font-semibold">${r.business_summary||'Research'}</div>
            <div class="flex gap-2"><span class="badge badge-blue">Opp: ${r.opportunity_score||'-'}/10</span><span class="badge badge-green">Conf: ${r.confidence_score||'-'}/100</span></div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div><span style="color:var(--muted)">Target:</span> ${r.target_customer||'-'}</div>
            <div><span style="color:var(--muted)">Digital Maturity:</span> ${r.digital_maturity||'-'}</div>
            <div><span style="color:var(--muted)">Services:</span> ${r.services||'-'}</div>
            <div><span style="color:var(--muted)">Evidence:</span> ${badge(r.evidence_level||'UNKNOWN')}</div>
          </div>
          ${r.observed_opportunities?`<div class="mt-2 text-sm"><span style="color:var(--muted)">Opportunities:</span> ${r.observed_opportunities}</div>`:''}
          ${r.research_notes?`<div class="mt-2 text-sm"><span style="color:var(--muted)">Notes:</span> ${r.research_notes}</div>`:''}
        </div>`).join('')}
    </div>
    <!-- Brand DNA Section -->
    <div class="card p-6 mb-6">
      <div class="flex justify-between items-center mb-4"><div class="text-lg font-bold">Brand DNA</div><button class="btn btn-primary btn-sm" onclick="showDnaForm('${id}')">${dna?'Edit':'+ Create'}</button></div>
      ${dna?`<div class="grid grid-cols-3 gap-4">
        <div><div class="text-xs" style="color:var(--muted)">Personality</div><div class="text-sm font-medium">${dna.brand_personality||'-'}</div></div>
        <div><div class="text-xs" style="color:var(--muted)">Target Audience</div><div class="text-sm font-medium">${dna.target_audience||'-'}</div></div>

let qrScanner=null;
function startScanner(){
  if(qrScanner)stopScanner();
  qrScanner=new Html5Qrcode('qr-reader');
  qrScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async(decodedText)=>{
    stopScanner();
    await processScan(decodedText);
  },(err)=>{}).catch(err=>toast('Camera error: '+err,'error'));
}
function stopScanner(){if(qrScanner){qrScanner.stop().then(()=>{qrScanner=null}).catch(()=>{qrScanner=null})}}

async function manualScan(){
  const token=val('manualToken');if(!token){toast('Enter a token','error');return}
  await processScan(token);
}

async function processScan(token){
  el('scanResult').innerHTML='<div class="loading"></div> Scanning...';
  const res=await api('scanQR',{gym_id:state.gymId,token,scanner_source:'Web Scanner'});
  const r=res.data||res;
  if(res.success){
    const color=r.result==='ACTIVE'?'var(--green)':r.result==='EXPIRING SOON'?'var(--yellow)':r.result==='EXPIRED'?'var(--red)':'var(--blue)';
    el('scanResult').innerHTML=`<div class="card p-6 text-center" style="border-color:${color}"><div class="text-6xl mb-4">${r.result==='ACTIVE'?'✅':r.result==='EXPIRING SOON'?'⚠️':r.result==='EXPIRED'?'🚫':'ℹ️'}</div><div class="text-2xl font-bold mb-2" style="color:${color}">${r.result}</div><div class="text-lg">${r.message||'Checked in'}</div>${r.member?`<div class="mt-4 text-sm" style="color:var(--muted)">${r.member.name} - ${r.member.member_id}</div>`:''}</div>`;
    toast(r.message||'Checked in');
  }else{
    const color=r.result==='INVALID'?'var(--red)':r.result==='DUPLICATE'?'var(--yellow)':'var(--red)';
    el('scanResult').innerHTML=`<div class="card p-6 text-center" style="border-color:${color}"><div class="text-6xl mb-4">${r.result==='INVALID'?'🚫':'⚠️'}</div><div class="text-xl font-bold" style="color:${color}">${r.result||'Error'}</div><div class="text-lg mt-2">${r.message||'Scan failed'}</div></div>`;
    toast(r.message||'Error','error');
  }
  loadTodayCheckins(state.gymId);
}

}

      <table><thead><tr><th>Member</th><th>Date/Time</th><th>Result</th><th>Scanner Source</th></tr></thead>
      <tbody>${att.slice(0,50).map(a=>`<tr><td>${a.member_name||'Unknown'}</td><td class="text-sm">${new Date(a.timestamp).toLocaleString('en-GB')}</td><td>${badge(a.result)}</td><td class="text-sm">${a.scanner_source||'-'}</td></tr>`).join('')}</tbody></table>
      ${att.length===0?'<div class="text-center py-8" style="color:var(--muted)">No attendance records yet</div>':''}
    </div>`;
}

async function gymLeads(gid){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const res=await api('listGymLeads',null,gid);
  const leads=res.data||[];
  el('content').innerHTML=`
    <div class="flex justify-between items-center mb-6"><div class="text-2xl font-bold">Leads & Trials</div><button class="btn btn-primary" onclick="showGymLeadForm()">+ Add Lead</button></div>
    <div class="card overflow-hidden">
      <table><thead><tr><th>Name</th><th>Phone</th><th>Fitness Goal</th><th>Source</th><th>Status</th><th>Update</th></tr></thead>
      <tbody>${leads.map(l=>`<tr><td class="font-semibold">${l.name}</td><td>${l.phone||'-'}</td><td class="text-sm">${l.fitness_goal||'-'}</td><td class="text-sm">${l.source||'-'}</td><td>${badge(l.status)}</td><td><select onchange="updateGymLead('${l.id}',this.value)" class="!w-auto !py-1 text-xs"><option ${l.status==='NEW'?'selected':''}>NEW</option><option ${l.status==='CONTACTED'?'selected':''}>CONTACTED</option><option ${l.status==='TRIAL BOOKED'?'selected':''}>TRIAL BOOKED</option><option ${l.status==='TRIAL COMPLETED'?'selected':''}>TRIAL COMPLETED</option><option ${l.status==='CONVERTED'?'selected':''}>CONVERTED</option><option ${l.status==='LOST'?'selected':''}>LOST</option><option ${l.status==='FOLLOW-UP'?'selected':''}>FOLLOW-UP</option></select></td></tr>`).join('')}</tbody></table>
      ${leads.length===0?'<div class="text-center py-8" style="color:var(--muted)">No leads yet</div>':''}
    </div>`;
}

function showGymLeadForm(){
  el('app').insertAdjacentHTML('beforeend',`
  <div class="modal-bg" id="glModal" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <div class="text-xl font-bold mb-4">Add Lead</div>
      <div class="space-y-3">
        <div><label class="text-xs" style="color:var(--muted)">Name *</label><input id="gl_name"></div>
        <div><label class="text-xs" style="color:var(--muted)">Phone *</label><input id="gl_phone"></div>
        <div><label class="text-xs" style="color:var(--muted)">Email</label><input id="gl_email"></div>
        <div><label class="text-xs" style="color:var(--muted)">Fitness Goal</label><input id="gl_goal" placeholder="Weight loss, muscle gain..."></div>
        <div><label class="text-xs" style="color:var(--muted)">Preferred Schedule</label><input id="gl_sched" placeholder="Weekday evenings"></div>
        <div><label class="text-xs" style="color:var(--muted)">Source</label><select id="gl_source"><option>Website form</option><option>Walk-in</option><option>Phone inquiry</option><option>Referral</option><option>Social media</option><option>Other</option></select></div>
      </div>
      <div class="flex gap-3 mt-4"><button class="btn btn-secondary flex-1" onclick="el('glModal').remove()">Cancel</button><button class="btn btn-primary flex-1" onclick="submitGymLead()">Add Lead</button></div>
    </div>
  </div>`);
}

async function submitGymLead(){
  const data={gym_id:state.gymId,name:val('gl_name'),phone:val('gl_phone'),email:val('gl_email'),fitness_goal:val('gl_goal'),preferred_schedule:val('gl_sched'),source:val('gl_source'),status:'NEW'};
  if(!data.name||!data.phone){toast('Name and phone required','error');return}
  el('glModal').remove();toast('Adding lead...');
  const res=await api('createGymLead',data);if(res.success){toast('Lead added!');gymLeads(state.gymId)}else{toast('Error','error')}
}

async function updateGymLead(id,status){await api('updateGymLead',{status},id);toast('Status updated');gymLeads(state.gymId)}

async function gymStaff(gid){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const res=await api('listStaff',null,gid);
  const staff=res.data||[];
  el('content').innerHTML=`
    <div class="flex justify-between items-center mb-6"><div class="text-2xl font-bold">Staff</div><button class="btn btn-primary" onclick="showStaffForm()">+ Add Staff</button></div>
    <div class="card overflow-hidden">
      <table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Phone</th></tr></thead>
      <tbody>${staff.map(s=>`<tr><td class="font-semibold">${s.name}</td><td><span class="badge badge-blue">${s.role}</span></td><td>${s.email||'-'}</td><td>${s.phone||'-'}</td></tr>`).join('')}</tbody></table>
      ${staff.length===0?'<div class="text-center py-8" style="color:var(--muted)">No staff yet</div>':''}
    </div>`;
}

function showStaffForm(){
  el('app').insertAdjacentHTML('beforeend',`
  <div class="modal-bg" id="stModal" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <div class="text-xl font-bold mb-4">Add Staff Member</div>
      <div class="space-y-3">
        <div><label class="text-xs" style="color:var(--muted)">Name</label><input id="st_name"></div>
        <div><label class="text-xs" style="color:var(--muted)">Role</label><select id="st_role"><option>GYM OWNER</option><option>GYM MANAGER</option><option>RECEPTION STAFF</option><option>TRAINER</option><option>AGENCY ADMIN</option></select></div>
        <div><label class="text-xs" style="color:var(--muted)">Email</label><input id="st_email"></div>
        <div><label class="text-xs" style="color:var(--muted)">Phone</label><input id="st_phone"></div>
      </div>
      <div class="flex gap-3 mt-4"><button class="btn btn-secondary flex-1" onclick="el('stModal').remove()">Cancel</button><button class="btn btn-primary flex-1" onclick="submitStaff()">Add Staff</button></div>
    </div>
  </div>`);
}

async function submitStaff(){
  const data={gym_id:state.gymId,name:val('st_name'),role:val('st_role'),email:val('st_email'),phone:val('st_phone')};
  if(!data.name){toast('Name required','error');return}
  el('stModal').remove();toast('Adding staff...');
  const res=await api('createStaff',data);if(res.success){toast('Staff added!');gymStaff(state.gymId)}else{toast('Error','error')}
}

async function gymAudit(gid){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const res=await api('getAuditLog',null,gid);
  const logs=res.data||[];
  const colors={MEMBER_CREATED:'var(--green)',MEMBERSHIP_CREATED:'var(--blue)',QR_REGENERATED:'var(--yellow)',QR_REVOKED:'var(--red)',ATTENDANCE_RECORDED:'var(--accent)',CLIENT_CONVERTED:'var(--green)',STAFF_CREATED:'var(--blue)',LEAD_CREATED:'var(--blue)'};
  el('content').innerHTML=`
    <div class="text-2xl font-bold mb-6">Audit Log</div>
    <div class="card p-4">
      ${logs.length===0?'<div class="text-center py-8" style="color:var(--muted)">No audit entries yet</div>':logs.map(l=>`<div class="flex gap-3 py-3 border-b" style="border-color:var(--border)"><div class="w-2 h-2 rounded-full mt-2" style="background:${colors[l.action]||'var(--muted)'}"></div><div class="flex-1"><div class="flex justify-between"><div class="font-semibold text-sm">${l.action}</div><div class="text-xs" style="color:var(--muted)">${new Date(l.timestamp).toLocaleString('en-GB')}</div></div><div class="text-sm" style="color:var(--muted)">${l.details||''} ${l.actor?'· by '+l.actor:''}</div></div></div>`).join('')}
    </div>`;
}

async function gymSettings(gid){
  el('content').innerHTML='<div class="loading"></div> Loading...';
  const res=await api('getTenant',null,gid);
  const t=res.data||{};
  el('content').innerHTML=`
    <div class="text-2xl font-bold mb-6">Settings</div>
    <div class="card p-6 max-w-2xl">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs" style="color:var(--muted)">Gym Name</label><input id="set_name" value="${t.gym_name||''}"></div>
        <div><label class="text-xs" style="color:var(--muted)">Phone</label><input id="set_phone" value="${t.phone||''}"></div>
        <div><label class="text-xs" style="color:var(--muted)">Email</label><input id="set_email" value="${t.email||''}"></div>
        <div><label class="text-xs" style="color:var(--muted)">Logo URL</label><input id="set_logo" value="${t.logo||''}"></div>
        <div class="col-span-2"><label class="text-xs" style="color:var(--muted)">Address</label><input id="set_addr" value="${t.address||''}"></div>
        <div class="col-span-2"><label class="text-xs" style="color:var(--muted)">Opening Hours</label><input id="set_hours" value="${t.opening_hours||''}"></div>
        <div class="col-span-2"><label class="text-xs" style="color:var(--muted)">Social Links</label><input id="set_social" value="${t.social_links||''}"></div>
        <div><label class="text-xs" style="color:var(--muted)">Primary Color</label><input id="set_pc" type="color" value="${t.primary_color||'#DC2626'}" class="!h-10"></div>
        <div><label class="text-xs" style="color:var(--muted)">Secondary Color</label><input id="set_sc" type="color" value="${t.secondary_color||'#0A0A0C'}" class="!h-10"></div>
        <div><label class="text-xs" style="color:var(--muted)">Accent Color</label><input id="set_ac" type="color" value="${t.accent_color||'#F59E0B'}" class="!h-10"></div>
        <div><label class="text-xs" style="color:var(--muted)">Expiry Warning (days)</label><input id="set_ew" type="number" value="${t.expiry_warning_days||14}"></div>
      </div>
      <button class="btn btn-primary mt-4" onclick="saveSettings('${gid}')">Save Settings</button>
    </div>`;
}

async function saveSettings(gid){
  const data={gym_name:val('set_name'),phone:val('set_phone'),email:val('set_email'),logo:val('set_logo'),address:val('set_addr'),opening_hours:val('set_hours'),social_links:val('set_social'),primary_color:val('set_pc'),secondary_color:val('set_sc'),accent_color:val('set_ac'),expiry_warning_days:parseInt(val('set_ew'))||14};
  toast('Saving...');
  const res=await api('updateTenant',data,gid);
  if(res.success){toast('Settings saved!');state.gymName=data.gym_name;state.gymColors={primary:data.primary_color,secondary:data.secondary_color,accent:data.accent_color};saveState();render()}else{toast('Error','error')}
}

// === MEMBER PORTAL ===
function renderMemberPortal(){
  if(!state.memberToken){
    el('app').innerHTML=`
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="card p-8 max-w-md w-full">
        <div class="text-3xl font-black mb-2 text-center" style="color:var(--accent)">GYM OS</div>
        <div class="text-sm text-center mb-6" style="color:var(--muted)">Member Portal</div>
        <div class="space-y-3">
          <div><label class="text-xs" style="color:var(--muted)">Enter your QR token or Member ID</label><input id="portalToken" placeholder="Paste your QR token here..."></div>
          <button class="btn btn-primary w-full" onclick="memberLogin()">Access Portal</button>
          <button class="btn btn-secondary w-full" onclick="state.role=null;saveState();render()">← Back</button>
        </div>
      </div>
    </div>`;
    return;
  }
  loadMemberPortal();
}

async function memberLogin(){
  const token=val('portalToken');if(!token){toast('Enter your token','error');return}
  state.memberToken=token;saveState();loadMemberPortal();
}

async function loadMemberPortal(){
  el('app').innerHTML='<div class="min-h-screen flex items-center justify-center"><div class="loading"></div></div>';
  const res=await api('getMemberByToken',{token:state.memberToken});
  if(!res.success){
    toast('Member not found','error');state.memberToken=null;saveState();renderMemberPortal();return;
  }
  const{member,memberships,attendance,tenant}=res.data;
  const pc=tenant?.primary_color||'#DC2626';
  document.documentElement.style.setProperty('--accent',pc);
  const latestMem=memberships[memberships.length-1];
  const daysLeft=latestMem?Math.ceil((new Date(latestMem.expiry_date)-new Date())/86400000):null;
  el('app').innerHTML=`
  <div class="min-h-screen p-6 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div class="text-2xl font-black" style="color:${pc}">${tenant?.gym_name||'GYM OS'}</div>
      <button class="btn btn-secondary btn-sm" onclick="state.memberToken=null;saveState();render()">Logout</button>
    </div>
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="card p-5"><div class="text-sm font-bold mb-2">Profile</div><div class="text-sm space-y-1"><div class="font-semibold text-lg">${member.name}</div><div><span style="color:var(--muted)">ID:</span> <span class="font-mono">${member.member_id}</span></div><div><span style="color:var(--muted)">Status:</span> ${badge(member.status)}</div><div><span style="color:var(--muted)">Joined:</span> ${member.joining_date}</div><div><span style="color:var(--muted)">Phone:</span> ${member.phone||'-'}</div></div></div>
      <div class="card p-5 text-center">
        <div class="text-sm font-bold mb-3">Digital QR Pass</div>
        ${member.qr_active?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${member.qr_token}" class="mx-auto rounded-xl bg-white p-2" style="width:160px;height:160px"><div class="mt-2">${badge('ACTIVE')}</div>`:`<div class="badge badge-red">Revoked</div>`}
        <div class="text-xs mt-2" style="color:var(--muted)">Show at gym entrance</div>
      </div>
      <div class="card p-5"><div class="text-sm font-bold mb-2">Membership</div>
        ${latestMem?`<div class="space-y-1 text-sm"><div><span style="color:var(--muted)">Plan ID:</span> ${latestMem.plan_id?.slice(-8)}</div><div><span style="color:var(--muted)">Start:</span> ${latestMem.start_date}</div><div><span style="color:var(--muted)">Expiry:</span> ${latestMem.expiry_date}</div><div><span style="color:var(--muted)">Days left:</span> <span class="font-bold" style="color:${daysLeft<0?'var(--red)':daysLeft<14?'var(--yellow)':'var(--green)'}">${daysLeft}</span></div><div>${badge(latestMem.status)}</div></div>`:'<div style="color:var(--muted)">No active membership</div>'}
      </div>
    </div>
    <div class="card p-6">
      <div class="flex justify-between items-center mb-4"><div class="text-lg font-bold">Attendance History</div><div class="flex gap-4 text-sm"><div><span style="color:var(--muted)">Total:</span> <span class="font-bold">${attendance.length}</span></div></div></div>
      ${attendance.length>0?`<table><thead><tr><th>Date</th><th>Time</th><th>Result</th></tr></thead><tbody>${attendance.slice(0,20).map(a=>`<tr><td>${new Date(a.timestamp).toLocaleDateString('en-GB')}</td><td class="text-sm">${new Date(a.timestamp).toLocaleTimeString('en-GB')}</td><td>${badge(a.result)}</td></tr>`).join('')}</tbody></table>`:'<div class="text-center py-4" style="color:var(--muted)">No check-ins yet</div>'}
    </div>
  </div>`;
}

function logout(){state.role=null;state.gymId=null;state.memberToken=null;saveState();render()}

// Init
render();
</script>
</body>
</html>
