    <!-- Toast Notification Container -->

    <script>

        // Global App State & API URL
        const API_URL = 'https://solene-dcb41753.base44.app/functions/gymOsApi';
        
        const state = {
            gym_id: localStorage.getItem('selected_gym_id') || '6a894d615f97ea688811b105',
            role: localStorage.getItem('selected_role') || 'OWNER',
            mode: 'admin', // 'admin' | 'portal'
            activeTab: 'command-center',
            portalToken: '9299d79e92c6a8ce6346e390ea781317',
            portalData: null,
            html5QrcodeScanner: null,
            cache: {}
        };

        // Standard Required API Helper Function
        async function api(action, data={}, id=null) {
            const res = await fetch(API_URL, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action, data, id})
            });
            return await res.json();
        }

        // Navigation Modules Configuration
        const modules = [
            { id: 'command-center', name: 'Command Center', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>' },
            { id: 'lead-crm', name: 'Lead CRM', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>' },
            { id: 'trials', name: 'Trials', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
            { id: 'qr-scanner', name: 'QR Scanner', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>' },
            { id: 'members', name: 'Members', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>' },
            { id: 'memberships', name: 'Memberships', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>' },
            { id: 'payments', name: 'Payments', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>' },
            { id: 'revenue', name: 'Revenue', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>' },
            { id: 'whatsapp', name: 'WhatsApp', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>' },
            { id: 'at-risk', name: 'At-Risk', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>' },
            { id: 'classes', name: 'Classes', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>' },
            { id: 'staff', name: 'Staff', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6a2 2 0 11-4 0 2 2 0 014 0zm8 10a2 2 0 11-4 0 2 2 0 014 0zM4 16a2 2 0 11-4 0 2 2 0 014 0z"/>' },
            { id: 'referrals', name: 'Referrals', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>' },
            { id: 'tasks', name: 'Tasks', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>' },
            { id: 'events', name: 'Events', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
            { id: 'settings', name: 'Settings', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>' },
            { id: 'audit-log', name: 'Audit Log', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>' }
        ];

        // Toast Notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            
            let bg = 'bg-brand-card border-blue-500/50 text-blue-200';
            if (type === 'success') bg = 'bg-brand-card border-emerald-500/50 text-emerald-200';
            if (type === 'error') bg = 'bg-brand-card border-rose-500/50 text-rose-200';
            if (type === 'warning') bg = 'bg-brand-card border-amber-500/50 text-amber-200';

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl flex items-center space-x-3 text-xs font-medium backdrop-blur-md transform transition-all duration-300 translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Helpers for Status Badges
        function getStatusBadge(status) {
            if (!status) return '<span class="px-2 py-0.5 rounded-full text-[10px] bg-gray-500/10 text-gray-400 border border-gray-500/20">UNKNOWN</span>';
            const s = status.toUpperCase();
            if (['ACTIVE', 'SAFE', 'JOINED', 'COMPLETED', 'RENEWED', 'PAID'].includes(s)) {
                return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 tracking-wider">${s}</span>`;
            }
            if (['WARNING', 'EXPIRING', 'FOLLOW_UP', 'CONTACT_REQUIRED', 'DUPLICATE', 'URGENT', 'HIGH', 'HIGH_RISK', 'MEDIUM_RISK', 'PENDING'].includes(s)) {
                return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 tracking-wider">${s}</span>`;
            }
            if (['EXPIRED', 'AT_RISK', 'LOST', 'INVALID', 'CANCELLED', 'OVERDUE'].includes(s)) {
                return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20 tracking-wider">${s}</span>`;
            }
            if (['INFO', 'TODAY', 'NEW', 'REQUESTED', 'BOOKED', 'PASS_GENERATED', 'INTERESTED', 'TRIAL_BOOKED', 'TRIAL_COMPLETED'].includes(s)) {
                return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/10 text-[#00E5FF] border border-blue-500/20 tracking-wider">${s}</span>`;
            }
            return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-gray-500/10 text-gray-300 border border-gray-500/20 tracking-wider">${s}</span>`;
        }

        function getDemoBadge(isSample) {
            if (isSample) {
                return '<span class="px-1.5 py-0.5 text-[9px] font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded uppercase tracking-wider">DEMO DATA</span>';
            }
            return '';
        }

        // App Initialization
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('role-select').value = state.role;
            renderNav();
            loadActiveModule();

            document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileSidebar);
        });

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function changeRole(role) {
            state.role = role;
            localStorage.setItem('selected_role', role);
            showToast('Role updated to ' + role, 'info');
            loadActiveModule();
        }

        function switchMode(mode) {
            state.mode = mode;
            const adminBtn = document.getElementById('mode-admin-btn');
            const portalBtn = document.getElementById('mode-portal-btn');
            const sidebar = document.getElementById('sidebar');

            if (mode === 'admin') {
                adminBtn.className = 'px-3 py-1.5 rounded-md font-medium transition-all bg-[#0066FF] text-white';
                portalBtn.className = 'px-3 py-1.5 rounded-md font-medium text-brand-muted hover:text-white transition-all';
                sidebar.classList.remove('hidden');
                loadActiveModule();
            } else {
                portalBtn.className = 'px-3 py-1.5 rounded-md font-medium transition-all bg-[#0066FF] text-white';
                adminBtn.className = 'px-3 py-1.5 rounded-md font-medium text-brand-muted hover:text-white transition-all';
                sidebar.classList.add('hidden');
                renderMemberPortal();
            }
        }

        function renderNav() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = modules.map(m => {
                const isActive = state.activeTab === m.id;
                const activeClass = isActive 
                    ? 'bg-[#0066FF]/15 text-[#00E5FF] border border-[#0066FF]/30 font-semibold shadow-lg shadow-blue-500/10' 
                    : 'text-brand-muted hover:text-white hover:bg-white/5 border border-transparent';
                
                return `
                    <button onclick="selectTab('${m.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs transition-all ${activeClass}">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${m.icon}</svg>
                        <span class="truncate">${m.name}</span>
                    </button>
                `;
            }).join('');
        }

        function selectTab(tabId) {
            state.activeTab = tabId;
            renderNav();
            if (window.innerWidth < 768) {
                toggleMobileSidebar();
            }
            loadActiveModule();
        }

        function refreshActiveModule() {
            if (state.mode === 'portal') {
                renderMemberPortal();
            } else {
                loadActiveModule();
            }
            showToast('Refreshed data', 'info');
        }

        // Modal Helpers
        function openModal(contentHtml) {
            const modalContainer = document.getElementById('modal-container');
            const modalBox = document.getElementById('modal-box');
            modalBox.innerHTML = `
                <button onclick="closeModal()" class="absolute top-4 right-4 text-brand-muted hover:text-white p-1 rounded-lg hover:bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                ${contentHtml}
            `;
            modalContainer.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        // Render Loading State
        function renderLoading(containerId = 'main-content') {
            document.getElementById(containerId).innerHTML = `
                <div class="h-96 flex flex-col items-center justify-center space-y-4">
                    <div class="w-10 h-10 border-4 border-[#0066FF]/30 border-t-[#00E5FF] rounded-full animate-spin"></div>
                    <span class="text-xs font-medium text-brand-muted animate-pulse">Loading GYM OS v2 Data...</span>
                </div>
            `;
        }

        // Main Module Loader Router
        async function loadActiveModule() {
            if (state.mode === 'portal') return;

            renderLoading();

        function handleCommandAction(action, id) {
            if (action === 'RENEW') {
                selectTab('memberships');
            } else if (action === 'OPEN_LEAD') {
                selectTab('lead-crm');
            } else if (action === 'VIEW_TRIAL') {
                selectTab('trials');
            } else if (action === 'VIEW_MEMBER') {
                if (id) showMemberDetailModal(id);
                else selectTab('members');
            } else if (action === 'VIEW_CLASS') {
                selectTab('classes');
            } else if (action === 'VIEW_ATTENDANCE' || action === 'VIEW_MEMBERS') {
                selectTab('members');
            } else {
                selectTab('tasks');
            }
        }

                phone: document.getElementById('lead_phone').value,
                email: document.getElementById('lead_email').value,
                status: document.getElementById('lead_status').value,
                source: document.getElementById('lead_source').value,
                fitness_goals: document.getElementById('lead_goals').value
            };
            const res = await api('createGymLead', data);
            if (res.success) {
                showToast('Lead created successfully!', 'success');
                closeModal();
                renderLeadCRM();
            } else {
                showToast('Error creating lead: ' + (res.error || 'Failed'), 'error');
            }
        }

        function startCameraScanner() {
            if (state.html5QrcodeScanner) {
                stopCameraScanner();
            }
            state.html5QrcodeScanner = new Html5Qrcode("reader");
            state.html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    handleScanToken(decodedText, 'CAMERA');
                },
                (errorMessage) => {
                    // Frame scan attempt
                }
            ).catch(err => {
                showToast("Camera access error: " + err, "error");
            });
        }

        function stopCameraScanner() {
            if (state.html5QrcodeScanner) {
                state.html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').innerText = "Scanner inactive";
                    state.html5QrcodeScanner = null;
                }).catch(err => console.error(err));
            }
        }

        async function handleScanToken(token, source) {
            if (!token) {
                showToast('Please enter a valid token string', 'warning');
                return;
            }

            const box = document.getElementById('scan_result_box');
            box.innerHTML = `<div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div><span class="text-xs text-brand-muted">Verifying Token...</span>`;

            const res = await api('scanQR', { gym_id: state.gym_id, token, scanner_source: source });
            
            let colorBg = 'bg-brand-bg border-custom';
            let colorBadge = getStatusBadge(res.result || 'INVALID');
            
            if (res.result === 'ACTIVE') colorBg = 'bg-emerald-500/10 border-emerald-500/30';
            if (res.result === 'EXPIRING' || res.result === 'DUPLICATE') colorBg = 'bg-amber-500/10 border-amber-500/30';
            if (res.result === 'EXPIRED' || res.result === 'INVALID') colorBg = 'bg-rose-500/10 border-rose-500/30';

            const memberName = res.member?.name || res.trial?.lead_name || 'Pass Holder';

            box.className = `min-h-[220px] rounded-2xl border p-6 flex flex-col items-center justify-center text-center space-y-3 ${colorBg}`;
            box.innerHTML = `
                ${colorBadge}
                <div class="text-base font-bold text-white">${memberName}</div>
                <div class="text-xs text-brand-muted max-w-xs">${res.message || 'Check-in processed.'}</div>
                ${res.membership?.expiry_date ? `<div class="text-[10px] font-mono text-brand-muted">Membership Expiry: ${res.membership.expiry_date}</div>` : ''}
            `;

            showToast(`Scanned: ${res.result} (${memberName})`, res.result === 'ACTIVE' ? 'success' : 'warning');
        }

        function filterPaymentsTable() {
            const q = (document.getElementById('payment-search')?.value || '').toLowerCase();
            const st = document.getElementById('payment-status-filter')?.value || 'ALL';
            const payments = state.cache.payments || [];
            const filtered = payments.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(q) || p.invoice.toLowerCase().includes(q) || p.plan.toLowerCase().includes(q);
                const matchesStatus = (st === 'ALL' || p.status === st);
                return matchesQuery && matchesStatus;
            });
            renderPaymentsTableRows(filtered);
        }

        function renderPaymentsTableRows(list) {
            const tbody = document.getElementById('payments-tbl-body');
            if (!tbody) return;
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-4 text-center text-brand-muted">No payment records found matching filters.</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(p => `

                    <td class="py-3 px-3 font-semibold text-white flex items-center space-x-2">

                    <td class="py-3 px-3 font-mono font-bold text-white">₹${p.amount.toLocaleString('en-IN')}</td>
                    <td class="py-3 px-3 text-brand-muted font-mono">${p.date}</td>

                            ${p.status !== 'PAID' ? `<button onclick="markPaymentPaid('${p.invoice}', '${p.name}')" class="px-2 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-lg text-[10px] font-semibold">Mark Paid</button>` : ''}
                            <button onclick="generateInvoice('${p.invoice}', '${p.name}')" class="px-2 py-1 bg-white/5 hover:bg-white/10 text-brand-muted hover:text-white rounded-lg text-[10px] font-semibold border border-custom">Invoice</button>

        function markPaymentPaid(invoice, name) {
            const payments = state.cache.payments || [];

        async function handlePortalLogin(token) {
            if (!token) return;
            showToast('Fetching member pass...', 'info');
            const res = await api('getMemberByToken', { token });
            if (res.success && res.data && res.data.member) {
                state.portalData = res.data;
                state.portalToken = token;
                renderMemberPortal();
                showToast('Welcome back, ' + res.data.member.name, 'success');
            } else {
                showToast('Invalid member token pass', 'error');
            }
        }
